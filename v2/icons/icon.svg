<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38C6FF"/>
      <stop offset="0.55" stop-color="#2E86FF"/>
      <stop offset="1" stop-color="#5E5CE6"/>
    </linearGradient>
    <linearGradient id="body" x1="256" y1="236" x2="256" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9F0FF"/>
    </linearGradient>
  </defs>

  <!-- full-bleed colored background (iOS rounds the corners itself) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- padlock shackle -->
  <path d="M198 244 V198 a58 58 0 0 1 116 0 V244"
        fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>

  <!-- padlock body -->
  <rect x="150" y="236" width="212" height="176" rx="40" fill="url(#body)"/>

  <!-- *** asterisks -->
  <g stroke="#2E86FF" stroke-width="11" stroke-linecap="round">
    <g transform="translate(206 324)">
      <line x1="0" y1="-18" x2="0" y2="18"/>
      <line x1="-15.6" y1="-9" x2="15.6" y2="9"/>
      <line x1="-15.6" y1="9" x2="15.6" y2="-9"/>
    </g>
    <g transform="translate(256 324)">
      <line x1="0" y1="-18" x2="0" y2="18"/>
      <line x1="-15.6" y1="-9" x2="15.6" y2="9"/>
      <line x1="-15.6" y1="9" x2="15.6" y2="-9"/>
    </g>
    <g transform="translate(306 324)">
      <line x1="0" y1="-18" x2="0" y2="18"/>
      <line x1="-15.6" y1="-9" x2="15.6" y2="9"/>
      <line x1="-15.6" y1="9" x2="15.6" y2="-9"/>
    </g>
  </g>
</svg>
